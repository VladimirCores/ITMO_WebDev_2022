version: '3'
services:
  app:
    build: .
    restart: always
    container_name: app
    environment:
      - PORT=8001
      - DATABASE_URL=postgres://vladimirminkin:TZhWrfX0O4ui@shy-frost-373586.us-east-2.aws.neon.tech/neondb?options=project%3Dshy-frost-373586&sslmode=require
      - API_URL=https://jsonplaceholder.typicode.com
    ports:
      - "8001:8001"

  nginx:
    image: nginx:latest
    restart: unless-stopped
    container_name: nginx
    depends_on:
      - app
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    links:
      - app

